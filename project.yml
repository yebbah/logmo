# Generate the Xcode project with:  brew install xcodegen && DEVELOPMENT_TEAM=<your team id> xcodegen
name: logmo
options:
  bundleIdPrefix: com.yebbah
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"   # from the environment, so the Team ID is never committed
targets:
  logmo:
    type: application
    platform: iOS
    sources: [logmo]
    info:
      path: logmo/Info.plist
      properties:
        CFBundleDisplayName: logmo
        UILaunchScreen: {}
        # Landscape is allowed only so a chart can open full screen; AppDelegate keeps everything else portrait.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Added when Apple Health lands:
        # NSHealthShareUsageDescription: "Read weight, water and nutrition to save you typing."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yebbah.logmo
        TARGETED_DEVICE_FAMILY: "1"
  logmo-tests:
    type: bundle.unit-test
    platform: iOS
    sources: [logmo-tests]
    dependencies: [{ target: logmo }]
