# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: logmo
options:
  bundleIdPrefix: com.yebbah
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""      # set your Apple team in Xcode > Signing
targets:
  logmo:
    type: application
    platform: iOS
    sources: [logmo]
    info:
      path: logmo/Info.plist
      properties:
        CFBundleDisplayName: logmo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Added when Apple Health lands:
        # NSHealthShareUsageDescription: "Read weight, water and nutrition to save you typing."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yebbah.logmo
        TARGETED_DEVICE_FAMILY: "1"
  logmo-tests:
    type: bundle.unit-test
    platform: iOS
    sources: [logmo-tests]
    dependencies: [{ target: logmo }]
